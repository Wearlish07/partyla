<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0807">
  <title>BelLOUtku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css?v=26">
  <style>
    /* yükleme ekranı: style.css ve yazı tipleri inmeden önce de görünsün diye burada */
    #loader { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 40%, #1d130d 0%, #0b0807 70%); color: #f1e8d8;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; transition: opacity 0.45s ease, visibility 0s linear 0.45s; }
    #loader.out { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader .ld-box { width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #loader .ld-crest { display: flex; align-items: center; gap: 10px; color: #c9a45a; font: italic 600 13px "Playfair Display", Georgia, serif; letter-spacing: 3px; text-transform: uppercase; }
    #loader .ld-crest span { width: 34px; height: 1px; background: rgba(201, 164, 90, 0.5); }
    #loader h1 { margin: 0; font: 800 clamp(34px, 9vw, 54px) "Playfair Display", Georgia, serif; letter-spacing: 1px; color: #f1e8d8; }
    #loader h1 span { color: #c9a45a; }
    #loader h2 { margin: 0; font: 800 clamp(24px, 6vw, 32px) "Playfair Display", Georgia, serif; color: #f1e8d8; }
    #loader .ld-ico { width: 54px; height: 54px; padding: 11px; border: 1px solid rgba(201, 164, 90, 0.35); border-radius: 50%; color: #c9a45a; }
    #loader .ld-ico .ico { width: 100%; height: 100%; }
    #loader .ld-goal { margin: 0; font-size: 14px; line-height: 1.5; color: #e2d6c0; max-width: 380px; }
    #loader .ld-bar { width: 100%; height: 3px; background: rgba(201, 164, 90, 0.16); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    #loader .ld-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #7a121c, #c9a45a, #e8cf8e); transform-origin: left; transform: scaleX(0.04); transition: transform 0.35s ease-out; }
    #loader .ld-text { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #a8977e; min-height: 1.3em; }
    #loader .ld-tip { margin: 6px 0 0; font: italic 14px "Playfair Display", Georgia, serif; color: #a8977e; max-width: 380px; line-height: 1.45; }
    #loader .ld-tip:empty { display: none; }
    #loader button { margin-top: 6px; font: 600 14px Inter, system-ui, sans-serif; color: #0b0807; background: #c9a45a; border: 0; border-radius: 3px; padding: 10px 18px; }
    /* yan çevrilmiş telefon: her şey kaydırmadan sığsın */
    @media (max-height: 500px) { #loader { padding: 12px 24px; } #loader .ld-box { gap: 8px; width: min(560px, 100%); } #loader .ld-ico { display: none; } #loader .ld-goal, #loader .ld-tip { font-size: 13px; line-height: 1.4; max-width: 540px; margin: 0; }
      #loader .ld-goal { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } #loader .ld-tip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } #loader .ld-tip:empty { display: none; } }
    @media (prefers-reduced-motion: reduce) { #loader, #loader .ld-bar i { transition: none; } }
  </style>
</head>
<body data-screen="menu">
  <div id="loader" role="status" aria-live="polite">
    <div class="ld-box">
      <div class="ld-crest"><span></span>Aile Meselesi<span></span></div>
      <h1>BelLO<span>Utku</span></h1>
      <div class="ld-bar"><i></i></div>
      <div class="ld-text">Yükleniyor</div>
      <p class="ld-tip"></p>
    </div>
  </div>
  <script>
    // İlk açılış: modüller inerken çubuk ilerler (js/loading.js devralır ve bitirir).
    (function () {
      var bar = document.querySelector('#loader .ld-bar i'), txt = document.querySelector('#loader .ld-text');
      var TIPS = ['Odayı kur, linki arkadaşlarına gönder: kurulum yok.', 'Telefonu yan çevirince kontroller daha rahat.', 'Her modun başında “Nasıl oynanır” çıkar, ? ile tekrar açılır.', 'Sol üstteki hoparlörden müzik ve efekt sesini ayrı ayrı ayarlayabilirsin.'];
      var tip = document.querySelector('#loader .ld-tip');
      tip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
      var boot = window.__boot = { p: 0.04, n: 0, done: false, timer: 0 };
      boot.set = function (p) { boot.p = Math.max(boot.p, Math.min(0.97, p)); bar.style.transform = 'scaleX(' + boot.p + ')'; };
      // indirilen her dosyada biraz ilerle, arada yavaşça sürün (asla %90'ı geçmeden)
      try {
        new PerformanceObserver(function (l) { boot.n += l.getEntries().length; if (!boot.done) boot.set(0.08 + 0.8 * (1 - Math.exp(-boot.n / 14))); }).observe({ type: 'resource', buffered: true });
      } catch (e) {}
      boot.timer = setInterval(function () { if (!boot.done) boot.set(boot.p + (0.9 - boot.p) * 0.03); }, 200);
      // 25 sn'de açılmadıysa: yenileme düğmesi
      setTimeout(function () {
        if (boot.done) return;
        txt.textContent = 'Bağlantı yavaş ya da bir şey takıldı';
        var b = document.createElement('button'); b.textContent = 'Sayfayı yenile'; b.onclick = function () { location.reload(); };
        document.querySelector('#loader .ld-box').appendChild(b);
      }, 25000);
    })();
  </script>
  <canvas id="canvas"></canvas>
  <div id="film" aria-hidden="true"></div>

  <section id="menu" class="screen">
    <div class="card menu-card">
      <div class="crest"><span></span><em>Aile Meselesi</em><span></span></div>
      <h1>BelLO<span>Utku</span></h1>
      <p class="tag">Arkadaşlarınla 3D parti oyunu · en fazla 12 kişi</p>
      <label>İsmin<input id="name" maxlength="16" placeholder="Örn. Uki" autocomplete="off"></label>
      <button id="btn-host" class="big">Oda kur</button>
      <div class="or"><span>ya da</span></div>
      <div class="row">
        <input id="code" maxlength="6" placeholder="ODA KODU" autocomplete="off">
        <button id="btn-join">Katıl</button>
      </div>
      <p id="busy" hidden></p>
    </div>
  </section>

  <section id="lobby" class="screen" hidden>
    <div class="card wide">
      <div class="lobby-head">
        <div>
          <small>Oda kodu</small>
          <div id="room-code">-----</div>
        </div>
        <button id="btn-copy">Davet linkini kopyala</button>
        <button id="btn-leave" class="ghost">Çık</button>
      </div>
      <div class="lobby-body">
        <div>
          <h3>Oyuncular <small id="players-count"></small></h3>
          <ul id="players"></ul>
          <h3>Karakterin</h3>
          <div id="chars"></div>
        </div>
        <div>
          <h3>Mod</h3>
          <div id="modes"></div>
          <div id="results" hidden></div>
          <h3 class="chat-h">Sohbet</h3>
          <div id="chat-slot"></div>
        </div>
      </div>
      <button id="btn-start" class="big">Oyunu başlat</button>
      <p id="wait" class="wait"></p>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div id="hud"></div>
    <div class="game-tools">
      <button id="btn-chat" class="ghost small" title="Sohbet (Enter)" hidden></button>
      <button id="btn-sound" class="ghost small" title="Ses ayarları"></button>
      <button id="btn-help" class="ghost small" title="Nasıl oynanır"></button>
      <button id="btn-exit" class="ghost small">Çık</button>
    </div>
  </section>

  <div id="chat" hidden>
    <div id="chat-log"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="140" placeholder="Mesaj yaz..." enterkeyhint="send">
      <button type="submit" title="Gönder">Gönder</button>
    </form>
  </div>
  <div id="guide" hidden></div>
  <button id="btn-mute" class="ghost small" title="Ses ayarları" aria-haspopup="dialog"></button>
  <div id="sound" hidden></div>
  <button id="btn-gfx" class="ghost small" title="Grafik"><span></span></button>
  <div id="rotate-hint">Daha rahat oynamak için telefonu yan çevir</div>
  <div id="toast" hidden></div>
  <script type="module" src="js/oyun-YA4NQSRC.js"></script>
</body>
</html>
